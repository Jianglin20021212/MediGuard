<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>首页 | 老人健康监护系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .dropbtn:hover { background: #1e3a8a; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 10; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .dropdown-content a:hover { background: #f0f2f5; padding-left: 20px; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-menu a:hover { background: #1e3a8a; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-menu button:hover { background: #1e3a8a; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .hero-banner {
            background: linear-gradient(135deg, rgba(44,82,130,0.85), rgba(30,58,138,0.9)), url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1920&q=80') center/cover;
            text-align: center; padding: 55px 20px; margin-bottom: 25px;
            position: relative; overflow: hidden; color: white;
        }
        .hero-circle { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); animation: heroPulse 5s ease-in-out infinite; pointer-events: none; }
        .hero-circle:nth-child(1) { width: 180px; height: 180px; top: -40px; left: -40px; }
        .hero-circle:nth-child(2) { width: 120px; height: 120px; top: 25%; right: -20px; animation-delay: 1.5s; }
        .hero-circle:nth-child(3) { width: 80px; height: 80px; bottom: 15%; left: 15%; animation-delay: 3s; }
        @keyframes heroPulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.15); opacity: 0.5; } }
        .hero-banner h1 { font-size: 36px; margin-bottom: 8px; position: relative; z-index: 1; }
        .hero-banner p { font-size: 15px; opacity: 0.9; position: relative; z-index: 1; }
        
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px 40px; position: relative; z-index: 1; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
        .stat-card { background: rgba(255,255,255,0.95); padding: 25px; border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: relative; overflow: hidden; backdrop-filter: blur(10px); }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .stat-card .icon { font-size: 36px; margin-bottom: 8px; }
        .stat-card .number { font-size: 34px; font-weight: bold; color: #2c5282; }
        .stat-card .label { color: #888; font-size: 13px; margin-top: 4px; }
        
        .section-title { font-size: 20px; color: #2c5282; margin: 28px 0 16px; display: flex; align-items: center; gap: 8px; padding-left: 14px; border-left: 4px solid #2c5282; }
        .func-grid { display: grid; gap: 18px; grid-template-columns: repeat(4, 1fr); }
        .func-card { background: rgba(255,255,255,0.95); padding: 26px 16px; border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: relative; overflow: hidden; backdrop-filter: blur(10px); }
        .func-card.locked { opacity: 0.55; cursor: not-allowed; }
        .func-card.locked:hover { transform: none; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .func-card:not(.locked)::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #2c5282, #38a169); transform: scaleX(0); transition: transform 0.3s; }
        .func-card:not(.locked):hover::after { transform: scaleX(1); }
        .func-card:not(.locked):hover { transform: translateY(-5px); box-shadow: 0 8px 22px rgba(0,0,0,0.1); }
        .func-card .card-icon { font-size: 40px; margin-bottom: 10px; display: inline-block; width: 70px; height: 70px; line-height: 70px; border-radius: 50%; transition: all 0.3s; }
        .func-card:not(.locked):hover .card-icon { transform: scale(1.1) rotate(3deg); }
        .func-card:nth-child(1) .card-icon { background: linear-gradient(135deg, #fff5f5, #fed7d7); }
        .func-card:nth-child(2) .card-icon { background: linear-gradient(135deg, #fffaf0, #feebc8); }
        .func-card:nth-child(3) .card-icon { background: linear-gradient(135deg, #f0fff4, #c6f6d5); }
        .func-card:nth-child(4) .card-icon { background: linear-gradient(135deg, #ebf8ff, #bee3f8); }
        .func-card:nth-child(5) .card-icon { background: linear-gradient(135deg, #faf5ff, #e9d8fd); }
        .func-card:nth-child(6) .card-icon { background: linear-gradient(135deg, #fff5f5, #fed7d7); }
        .func-card:nth-child(7) .card-icon { background: linear-gradient(135deg, #fffaf0, #feebc8); }
        .func-card:nth-child(8) .card-icon { background: linear-gradient(135deg, #f0fff4, #c6f6d5); }
        .func-card:nth-child(9) .card-icon { background: linear-gradient(135deg, #ebf8ff, #bee3f8); }
        .func-card:nth-child(10) .card-icon { background: linear-gradient(135deg, #faf5ff, #e9d8fd); }
        .func-card:nth-child(11) .card-icon { background: linear-gradient(135deg, #fff5f5, #fed7d7); }
        .func-card:nth-child(12) .card-icon { background: linear-gradient(135deg, #fffaf0, #feebc8); }
        .func-card h3 { margin: 8px 0; font-size: 15px; color: #2c5282; }
        .func-card p { color: #888; font-size: 12px; line-height: 1.4; }
        .func-card .lock-tip { display: block; color: #e53e3e; font-size: 11px; margin-top: 6px; font-weight: 500; }
        
        .quick-actions { background: rgba(255,255,255,0.95); border-radius: 14px; padding: 22px; margin-top: 28px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); backdrop-filter: blur(10px); }
        .quick-btn { padding: 12px 24px; border: 2px solid #2c5282; border-radius: 50px; background: white; color: #2c5282; font-size: 14px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 7px; font-weight: bold; }
        .quick-btn:hover { background: #2c5282; color: white; }
        .quick-btn.emergency { border-color: #e53e3e; color: #e53e3e; background: #fff5f5; animation: emergencyPulse 2s infinite; }
        .quick-btn.emergency:hover { background: #e53e3e; color: white; }
        @keyframes emergencyPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(229,62,62,0.4); } 50% { box-shadow: 0 0 0 12px rgba(229,62,62,0); } }
        
        .care-footer { text-align: center; padding: 35px 20px; margin-top: 35px; border-top: 1px solid #eee; }
        .care-footer .slogan { font-size: 18px; color: #2c5282; font-weight: bold; }
        .care-footer .sub-slogan { font-size: 12px; color: #999; margin-top: 6px; }
        
        @media (max-width: 1000px) { .func-grid { grid-template-columns: repeat(3, 1fr); } .stats { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) { .func-grid { grid-template-columns: repeat(2, 1fr); } .stats { grid-template-columns: 1fr; } .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>

<div class="hero-banner">
    <div class="hero-circle"></div><div class="hero-circle"></div><div class="hero-circle"></div>
    <h1>🏥 用心守护每一位老人</h1>
    <p>智能监护 · 健康预警 · AI预测 · 亲情互联</p>
</div>

<div class="container">
    <div class="stats">
        <div class="stat-card" onclick="location.href='list.html'"><div class="icon">👥</div><div class="number" id="elderCount">--</div><div class="label">在册老人</div></div>
        <div class="stat-card" onclick="location.href='add.html'"><div class="icon">📊</div><div class="number" id="todayMonitor">--</div><div class="label">今日监测</div></div>
        <div class="stat-card" onclick="location.href='warning.html'"><div class="icon">⚠️</div><div class="number" id="alertCount">--</div><div class="label">异常预警</div></div>
        <div class="stat-card" onclick="location.href='service.html'"><div class="icon">📋</div><div class="number" id="serviceCount">--</div><div class="label">服务记录</div></div>
    </div>
    
    <div class="section-title">📦 功能服务</div>
    <div class="func-grid" id="funcGrid"></div>
    
    <div class="section-title">⚡ 快捷操作</div>
    <div class="quick-actions" id="quickActions"></div>
</div>

<div class="care-footer">
    <div class="slogan">❤️ 用心守护，让爱陪伴</div>
    <div class="sub-slogan">老人健康监护系统 © 2026</div>
</div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); location.href = 'login.html'; }

    const navMenu = document.getElementById('navMenu');
    const commonDropdowns = `
        <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="ai_dashboard.html">AI预测</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
        <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
        <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
        <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
        <button onclick="logout()">退出登录</button>
    `;
    if (role === 'admin') {
        navMenu.innerHTML = `<div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            ${commonDropdowns}`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            ${commonDropdowns}`;
    } else {
        navMenu.innerHTML = `<div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            ${commonDropdowns}`;
    }

    // ========== 12张功能卡（所有角色都能看到，不能点的加锁提示） ==========
    const allCards = [
        { name: '老人信息管理', icon: '👥', desc: '查看和管理老人档案信息', link: 'list.html', 
          admin: true, worker: true, family: false },
        { name: '健康数据录入', icon: '📊', desc: '录入血压血糖等健康指标', link: 'add.html', 
          admin: true, worker: true, family: false },
        { name: 'AI健康预测', icon: '🤖', desc: '智能趋势分析与风险预警', link: 'ai_dashboard.html', 
          admin: true, worker: true, family: true },
        { name: '健康预警中心', icon: '⚠️', desc: '查看异常预警信息', link: 'warning.html', 
          admin: true, worker: true, family: true },
        { name: '风险评估报告', icon: '📈', desc: '老人健康风险等级评估', link: 'result.html', 
          admin: true, worker: true, family: true },
        { name: '数据可视化大屏', icon: '📺', desc: '健康趋势图表分析展示', link: 'dashboard.html', 
          admin: true, worker: true, family: true },
        { name: '服务记录管理', icon: '📋', desc: '查看和管理服务记录', link: 'service.html', 
          admin: true, worker: true, family: false },
        { name: '订单管理系统', icon: '📦', desc: '陪诊订单分配与跟踪', link: 'orders.html', 
          admin: true, worker: true, family: true },
        { name: '亲情留言板', icon: '💬', desc: '查看和发送亲情留言', link: 'messages.html', 
          admin: true, worker: true, family: true },
        { name: '家属绑定管理', icon: '🔗', desc: '家属绑定关注老人', link: 'family_bind.html', 
          admin: false, worker: false, family: true },
        { name: '一键紧急陪诊', icon: '🚑', desc: '快速发起陪诊求助', link: 'accompany.html', 
          admin: false, worker: false, family: true },
        { name: '健康知识库', icon: '📚', desc: '老年健康科普知识', link: 'knowledge.html', 
          admin: true, worker: true, family: true }
    ];

    // 获取提示文字
    function getLockTip(card) {
        if (card[role]) return ''; // 有权限，不提示
        if (role === 'admin') {
            if (!card.admin && card.worker && card.family) return '🔒 仅护工/家属可用';
            if (!card.admin && !card.worker && card.family) return '🔒 仅家属可用';
            if (!card.admin && card.worker && !card.family) return '🔒 仅护工可用';
        }
        if (role === 'worker') {
            if (card.admin && !card.worker && card.family) return '🔒 仅管理员/家属可用';
            if (card.admin && !card.worker && !card.family) return '🔒 仅管理员可用';
            if (!card.admin && !card.worker && card.family) return '🔒 仅家属可用';
        }
        if (role === 'family') {
            if (card.admin && card.worker && !card.family) return '🔒 仅管理员/护工可用';
            if (card.admin && !card.worker && !card.family) return '🔒 仅管理员可用';
            if (!card.admin && card.worker && !card.family) return '🔒 仅护工可用';
        }
        return '';
    }

    const grid = document.getElementById('funcGrid');
    grid.innerHTML = allCards.map(card => {
        const canAccess = card[role];
        const lockTip = getLockTip(card);
        return `
            <div class="func-card ${!canAccess ? 'locked' : ''}" ${canAccess ? `onclick="location.href='${card.link}'"` : ''}>
                <div class="card-icon">${card.icon}</div>
                <h3>${card.name}</h3>
                <p>${card.desc}</p>
                ${lockTip ? `<span class="lock-tip">${lockTip}</span>` : ''}
            </div>
        `;
    }).join('');

    // 加载统计数据
    async function loadStats() {
        try {
            const [er, hr, sr] = await Promise.all([fetch(`${API}/elders`), fetch(`${API}/healthData`), fetch(`${API}/serviceRecords`)]);
            const elders = (await er.json()).data || [];
            const healthData = (await hr.json()).data || [];
            const serviceRecords = (await sr.json()).data || [];
            const today = new Date().toISOString().slice(0,10);
            const latestMap = new Map();
            healthData.forEach(r => { const e = latestMap.get(r.elderId); if (!e || new Date(r.measureDate) > new Date(e.measureDate)) latestMap.set(r.elderId, r); });
            let totalAlerts = 0;
            for (let [id, r] of latestMap) {
                if (parseFloat(r.sysBP) >= 140) totalAlerts++;
                if (parseFloat(r.bloodSugar) >= 7.0) totalAlerts++;
                const hr = parseFloat(r.heartRate);
                if (hr >= 100 || (hr <= 50 && hr > 0)) totalAlerts++;
                if (parseFloat(r.temperature) >= 37.3) totalAlerts++;
                if (parseFloat(r.spo2) <= 94 && parseFloat(r.spo2) > 0) totalAlerts++;
            }
            document.getElementById('elderCount').innerText = elders.length;
            document.getElementById('todayMonitor').innerText = healthData.filter(d => d.measureDate === today).length;
            document.getElementById('alertCount').innerText = totalAlerts;
            document.getElementById('serviceCount').innerText = serviceRecords.length;
        } catch(e) {}
    }
        // 快捷操作按钮（护工和管理员不显示紧急求助）
let quickBtns = `
    <button class="quick-btn" onclick="location.href='ai_dashboard.html'">🤖 AI智能分析</button>
    <button class="quick-btn" onclick="location.href='add.html'">📝 录入健康数据</button>
    <button class="quick-btn" onclick="location.href='messages.html'">💬 发送亲情留言</button>
`;
if (role === 'family') {
    quickBtns += `<button class="quick-btn emergency" onclick="location.href='accompany.html'">🆘 一键紧急求助</button>`;
}
document.getElementById('quickActions').innerHTML = quickBtns;
    displayUserInfo();
    loadStats();
    setInterval(loadStats, 30000);
</script>
</body>
</html>

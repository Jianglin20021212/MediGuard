<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>健康风险评估 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1579154204601-01588f351e67?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #2c5282; margin-bottom: 20px; }
        .filter-bar { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .filter-bar select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; min-width: 180px; }
        .filter-bar button { padding: 8px 20px; background: #2c5282; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .elder-card { background: white; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .card-header { padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .card-header h3 { color: #2c5282; }
        .card-body { padding: 20px; }
        .health-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 15px; }
        .health-item { background: #f7f9fc; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; }
        .risk-box { padding: 15px; border-radius: 8px; }
        .risk-low { background: #e6f7f0; border-left: 4px solid #52c41a; }
        .risk-mid { background: #fff5e5; border-left: 4px solid #ed8936; }
        .risk-high { background: #fee; border-left: 4px solid #e53e3e; }
        .risk-low .level { color: #52c41a; }
        .risk-mid .level { color: #ed8936; }
        .risk-high .level { color: #e53e3e; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: white; display: none; z-index: 9999; }
        .toast.show { display: block; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <h2>📈 健康风险评估</h2>
    <div class="filter-bar">
        <select id="elderFilter"><option value="all">全部老人</option></select>
        <button onclick="filterResults()">筛选</button>
        <button onclick="loadData()">刷新</button>
    </div>
    <div id="resultsContainer"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API = 'http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let allElders = [], allHealth = [], assessments = [];

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); location.href = 'login.html'; }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="list.html">添加老人</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康管理 ▼</button><div class="dropdown-content"><a href="add.html">健康录入</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    }

    function getRiskScore(rec) {
        if (!rec) return { score: 0, level: 'low', suggestion: '暂无健康数据' };
        let score = 0;
        if (rec.sysBP >= 140) score += 2;
        if (rec.diaBP >= 90) score += 1;
        if (rec.bloodSugar >= 7.0) score += 2;
        if (rec.heartRate >= 100) score += 1;
        if (rec.temperature >= 37.3) score += 1;
        if (rec.spo2 <= 94) score += 2;
        let level = score >= 4 ? 'high' : (score >= 2 ? 'mid' : 'low');
        let suggestion = level === 'high' ? '存在多项严重异常，建议立即就医' : (level === 'mid' ? '存在部分异常，建议定期监测' : '各项指标基本正常');
        return { score, level, suggestion };
    }

    async function loadData() {
        try {
            const [er, hr] = await Promise.all([fetch(`${API}/elders`), fetch(`${API}/healthData`)]);
            allElders = (await er.json()).data || [];
            allHealth = (await hr.json()).data || [];
            const latest = new Map();
            allHealth.forEach(r => { const e = latest.get(r.elderId); if (!e || new Date(r.measureDate) > new Date(e.measureDate)) latest.set(r.elderId, r); });
            assessments = allElders.map(elder => {
                const rec = latest.get(elder.id);
                const risk = getRiskScore(rec);
                return { ...elder, healthRecord: rec, riskScore: risk.score, riskLevel: risk.level, riskSuggestion: risk.suggestion };
            });
               assessments.sort((a,b) => { if (a.riskScore !== b.riskScore) return b.riskScore - a.riskScore; return a.id.localeCompare(b.id); });
            
            if (role === 'family') {
                let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
                let boundElders = allElders.filter(e => bindings.some(b => b.elderId === e.id));
                document.getElementById('elderFilter').innerHTML = '<option value="">-- 请选择绑定的老人 --</option>' + boundElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
                // 筛选绑定老人的数据
                assessments = assessments.filter(a => bindings.some(b => b.elderId === a.id));
                // 家属默认不显示数据
                renderResults([]);
            } else {
                document.getElementById('elderFilter').innerHTML = '<option value="all">全部老人</option>' + allElders.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
                renderResults(assessments);
            }
        } catch(e) { showToast('加载失败'); }
    }

    function renderResults(data) {
        const container = document.getElementById('resultsContainer');
        if (!data.length) { container.innerHTML = '<div style="text-align:center;padding:40px;">暂无老人信息</div>'; return; }
        container.innerHTML = data.map(a => {
            const riskClass = a.riskLevel === 'high' ? 'risk-high' : (a.riskLevel === 'mid' ? 'risk-mid' : 'risk-low');
            const riskText = a.riskLevel === 'high' ? '高风险' : (a.riskLevel === 'mid' ? '中度风险' : '低风险');
            let healthHtml = '';
            if (a.healthRecord) {
                healthHtml = `<div class="health-grid"><div class="health-item"><span>血压</span><span>${a.healthRecord.sysBP}/${a.healthRecord.diaBP} mmHg</span></div><div class="health-item"><span>血糖</span><span>${a.healthRecord.bloodSugar} mmol/L</span></div><div class="health-item"><span>心率</span><span>${a.healthRecord.heartRate} 次/分</span></div><div class="health-item"><span>体温</span><span>${a.healthRecord.temperature} ℃</span></div><div class="health-item"><span>血氧</span><span>${a.healthRecord.spo2} %</span></div><div class="health-item"><span>体重</span><span>${a.healthRecord.weight} kg</span></div></div>`;
            } else { healthHtml = '<div style="padding:15px;color:#999;">暂无健康数据</div>'; }
            return `<div class="elder-card"><div class="card-header"><h3>${a.name}（编号：${a.id}）</h3></div><div class="card-body">${healthHtml}<div class="risk-box ${riskClass}"><div class="level"><strong>评估结果：${riskText}（风险分：${a.riskScore}）</strong></div><div>${a.riskSuggestion}</div></div></div></div>`;
        }).join('');
    }

function filterResults() { 
    const v = document.getElementById('elderFilter').value; 
    if (role === 'family') {
        if (!v) { renderResults([]); return; }
        renderResults(assessments.filter(a => a.id === v)); 
    } else {
        renderResults(v === 'all' ? assessments : assessments.filter(a => a.id === v)); 
    }
}    
    displayUserInfo();
    window.onload = loadData;
</script>
</body>
</html>

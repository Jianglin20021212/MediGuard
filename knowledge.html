    let currentCategory = 'all';

    function renderKnowledge(filteredList) {
        const grid = document.getElementById('knowledgeGrid');
        grid.innerHTML = filteredList.map(k => `
            <div class="knowledge-card" onclick="showDetail(${k.id})">
                <div class="card-image ${k.imageClass}">${k.icon}</div>
                <div class="card-body">
                    <h3>${k.title}</h3>
                    <p>${k.summary}</p>
                    <div class="card-tags">
                        ${k.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
                    </div>
                </div>
                <div class="card-footer">
                    <span>📖 ${k.readTime}</span>
                    <span>📊 ${k.level}</span>
                </div>
            </div>
        `).join('');
    }

    function filterByCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        const filtered = cat === 'all' ? knowledgeList : knowledgeList.filter(k => k.category === cat);
        renderKnowledge(filtered);
    }

    function filterKnowledge() {
        const kw = document.getElementById('searchInput').value.trim().toLowerCase();
        let list = currentCategory === 'all' ? knowledgeList : knowledgeList.filter(k => k.category === currentCategory);
        if (kw) list = list.filter(k => k.title.includes(kw) || k.summary.includes(kw) || k.tags.some(t => t.includes(kw)));
        renderKnowledge(list);
    }

    function showDetail(id) {
        const item = knowledgeList.find(k => k.id === id);
        if (!item) return;
        document.getElementById('modalTitle').innerHTML = `${item.icon} ${item.title}`;
        let html = `<div class="detail-icon">${item.icon}</div>`;
        item.detail.sections.forEach(s => {
            html += `<h3>📌 ${s.title}</h3><p>${s.content}</p>`;
        });
        if (item.detail.tips) {
            html += '<div class="tip-box"><strong>💡 实用小贴士：</strong><ul>';
            item.detail.tips.forEach(t => { html += `<li>${t}</li>`; });
            html += '</ul></div>';
        }
        html += `<div class="danger-box"><strong>${item.detail.warning}</strong></div>`;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    document.getElementById('detailModal').onclick = function(e) { if (e.target === this) closeModal(); };

    displayUserInfo();
    renderKnowledge(knowledgeList);
</script>

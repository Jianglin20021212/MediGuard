<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>一键陪诊 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #2c5282; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-number { font-size: 32px; font-weight: bold; color: #2c5282; }
        .elder-list { display: flex; flex-direction: column; gap: 15px; }
        .elder-card { background: white; border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .elder-name { font-size: 18px; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; }
        .btn-accompany { background: #2c5282; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .btn-emergency { background: #e53e3e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 320px; text-align: center; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; }
        .modal-btn.confirm { background: #2c5282; color: white; }
        .modal-btn.cancel { background: #ccc; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: white; display: none; z-index: 9999; }
        .toast.show { display: block; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <h2>🚑 一键陪诊 / 紧急求助</h2>
    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="orderCount">0</div><div>进行中的订单</div></div>
        <div class="stat-card"><div class="stat-number" id="emergencyCount">0</div><div>今日紧急求助</div></div>
    </div>
    <div id="elderList" class="elder-list">加载中...</div>
</div>

<div class="modal" id="confirmModal"><div class="modal-content"><p id="modalMessage">确定要发起请求吗？</p><div class="modal-buttons"><button class="modal-btn confirm" id="confirmBtn">确认</button><button class="modal-btn cancel" id="cancelBtn">取消</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let pendingRequest = null;

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); location.href = 'login.html'; }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
        <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
        <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
        <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
        <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
        <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
        <button onclick="logout()">退出登录</button>`;

    async function loadData() {
        try {
            const [er, or] = await Promise.all([fetch(`${API}/elders`), fetch(`${API}/orders`)]);
            const elders = (await er.json()).data || [];
            const orders = (await or.json()).data || [];
            document.getElementById('orderCount').innerText = orders.filter(o => o.status === 'pending' || o.status === 'accepted').length;
            document.getElementById('emergencyCount').innerText = orders.filter(o => o.type === '紧急求助' && o.createTime && o.createTime.startsWith(new Date().toISOString().slice(0,10))).length;
            let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
            const boundIds = new Set(bindings.map(b => b.elderId));
            let displayElders = boundIds.size ? elders.filter(e => boundIds.has(e.id)) : elders;
            const container = document.getElementById('elderList');
            if (!displayElders.length) { container.innerHTML = '<div style="text-align:center;padding:40px;">暂无绑定老人，请先绑定</div>'; return; }
            container.innerHTML = displayElders.map(e => `<div class="elder-card"><div><div class="elder-name">${e.name}</div><div>编号：${e.id}</div><div>电话：${e.phone || '未填写'}</div></div><div class="btn-group"><button class="btn-accompany" onclick="showConfirm('${e.id}','${e.name}','陪诊')">📋 陪诊</button><button class="btn-emergency" onclick="showConfirm('${e.id}','${e.name}','紧急求助')">🆘 紧急求助</button></div></div>`).join('');
        } catch(e) { showToast('加载失败'); }
    }

    function showConfirm(elderId, elderName, type) {
        document.getElementById('modalMessage').innerHTML = type === '陪诊' ? `确定要为 ${elderName} 发起陪诊请求吗？` : `⚠️ 紧急求助！确定要为 ${elderName} 发起紧急求助吗？`;
        pendingRequest = { elderId, elderName, type };
        document.getElementById('confirmModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('confirmModal').style.display = 'none'; pendingRequest = null; }
    async function sendRequest() {
        if (!pendingRequest) return;
        const { elderId, type } = pendingRequest;
        try {
            const res = await fetch(`${API}/orders`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ elderId, familyId: user.username, type, remark: type === '紧急求助' ? '紧急求助，请尽快处理！' : '陪诊请求' }) });
            if ((await res.json()).code === 200) { showToast(`${type}请求已发送`); loadData(); } else showToast('发送失败');
        } catch(e) { showToast('发送失败'); }
        closeModal();
    }

    displayUserInfo();
    document.getElementById('confirmBtn').onclick = sendRequest;
    document.getElementById('cancelBtn').onclick = closeModal;
    loadData();
</script>
</body>
</html>

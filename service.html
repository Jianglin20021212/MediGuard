<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务记录 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1551601651-2a8555f1a136?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .dropbtn:hover { background: #1e3a8a; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .dropdown-content a:hover { background: #f0f2f5; padding-left: 20px; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { background: #1e3a8a; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-menu button:hover { background: #1e3a8a; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #2c5282; margin-bottom: 20px; font-size: 24px; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #2c5282; }
        .stat-card .label { color: #666; font-size: 14px; margin-top: 5px; }
        
        .form-box, .list-box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #2c5282; border-left: 4px solid #2c5282; padding-left: 12px; }
        
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-item label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        .form-item input, .form-item select, .form-item textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: all 0.3s; }
        .form-item input:focus, .form-item select:focus, .form-item textarea:focus { outline: none; border-color: #2c5282; box-shadow: 0 0 0 2px rgba(44,82,130,0.1); }
        .form-item textarea { resize: vertical; min-height: 60px; }
        
        .btn-primary { padding: 10px 25px; background: #2c5282; color: white; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; transition: all 0.3s; }
        .btn-primary:hover { background: #1e3a8a; transform: translateY(-1px); }
        .btn-secondary { padding: 10px 25px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover { background: #5a6268; transform: translateY(-1px); }
        
        .toolbar { margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .toolbar select { padding: 8px 15px; border: 1px solid #ddd; border-radius: 6px; min-width: 150px; }
        .toolbar button { padding: 8px 20px; background: #2c5282; color: white; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .toolbar button:hover { background: #1e3a8a; }
        
        .table-wrapper { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; min-width: 1000px; border-collapse: collapse; background: white; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #2c5282; color: white; font-weight: 600; position: sticky; top: 0; text-align: center; }
        td { text-align: center; }
        td:nth-child(8) { text-align: left; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:hover { background: #f8f9fa; }
        
        .status-waiting { color: #1890ff; font-weight: bold; }
        .status-pending { color: #ed8936; font-weight: bold; }
        .status-completed { color: #52c41a; font-weight: bold; }
        
        .edit-btn { background: #1890ff; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; transition: all 0.3s; }
        .edit-btn:hover { background: #0c7cd5; }
        .delete-btn { background: #ff4d4f; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .delete-btn:hover { background: #e03a3c; }
        
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; display: none; z-index: 9999; animation: slideDown 0.3s ease; }
        .toast.show { display: block; }
        .toast.success { background: #52c41a; }
        .toast.error { background: #ff4d4f; }
        .toast.warning { background: #faad14; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } .stats { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <h2>📋 服务记录管理</h2>
    
    <div class="stats">
        <div class="stat-card"><div class="number" id="totalCount">0</div><div class="label">总服务次数</div></div>
        <div class="stat-card"><div class="number" id="waitingCount">0</div><div class="label">待进行</div></div>
        <div class="stat-card"><div class="number" id="completedCount">0</div><div class="label">已完成</div></div>
    </div>
    
    <div class="form-box">
        <div class="form-title">➕ 添加/编辑服务记录</div>
        <input type="hidden" id="editId">
        <div class="form-row">
            <div class="form-item"><label>* 老人编号</label><input type="text" id="elderId" placeholder="如：1001" list="elderList"><datalist id="elderList"></datalist></div>
            <div class="form-item"><label>* 服务类型</label><select id="serviceType"><option value="上门测血压">上门测血压</option><option value="用药指导">用药指导</option><option value="健康咨询">健康咨询</option><option value="生活照料">生活照料</option><option value="康复训练">康复训练</option><option value="心理慰藉">心理慰藉</option><option value="陪同就医">陪同就医</option></select></div>
            <div class="form-item"><label>* 服务人员</label><select id="servicePerson"><option value="">-- 请选择护工 --</option></select></div>
        </div>
        <div class="form-row">
            <div class="form-item"><label>* 开始时间</label><input type="datetime-local" id="serviceTime"></div>
            <div class="form-item"><label>时长(分钟)</label><input type="number" id="duration" value="30" min="1" max="480"></div>
            <div class="form-item"><label>服务内容</label><textarea id="content" rows="2" placeholder="详细服务内容..."></textarea></div>
        </div>
        <div><button class="btn-primary" id="saveBtn">💾 保存</button><button class="btn-secondary" id="resetBtn">🔄 重置</button></div>
    </div>
    
    <div class="list-box">
        <div class="form-title">📋 服务记录列表</div>
        <div class="toolbar">
    <select id="filterElder"><option value="">全部老人</option></select>
    <button onclick="filterRecords()">🔍 筛选</button>
    <button onclick="loadData()">🔄 刷新</button>
    <button onclick="clearAllRecords()" style="background:#e53e3e;">🗑️ 清除所有记录</button>
</div>
        <div class="table-wrapper">
            <table id="serviceTable">
                <thead><tr><th width="5%">ID</th><th width="10%">老人编号</th><th width="10%">老人姓名</th><th width="12%">服务类型</th><th width="10%">服务人员</th><th width="18%">开始时间</th><th width="8%">时长</th><th width="10%">服务内容</th><th width="8%">状态</th><th width="12%">操作</th></tr></thead>
                <tbody id="serviceBody"><tr><td colspan="10" style="text-align:center; padding:40px;">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) { window.location.href = 'login.html'; }
    const role = user.role || 'admin';
    let allRecords = [], allElders = [], allWorkers = [];

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); showToast('已退出登录', 'success'); setTimeout(() => window.location.href = 'login.html', 500); }
    function showToast(msg, type) { const t = document.getElementById('toast'); t.innerText = msg; t.className = `toast ${type} show`; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康管理 ▼</button><div class="dropdown-content"><a href="add.html">健康录入</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html" class="active">服务记录</a><a href="orders.html">订单管理</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html" class="active">服务记录</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    }

    async function loadWorkers() {
        try {
            const response = await fetch(API + '/users?role=worker');
            const result = await response.json();
            if (result.code === 200) {
                allWorkers = (result.data || []).filter(w => w.role === 'worker');
                document.getElementById('servicePerson').innerHTML = '<option value="">-- 请选择护工 --</option>' + allWorkers.map(w => `<option value="${w.username}">${w.username}</option>`).join('');
            }
        } catch(e) { console.error('加载护工列表失败:', e); }
    }

    function getServiceStatus(serviceTime, duration) {
        if (!serviceTime) return 'unknown';
        const now = new Date();
        const start = new Date(serviceTime);
        const end = new Date(start.getTime() + (duration || 30) * 60000);
        if (start > now) return 'waiting';
        if (start <= now && now < end) return 'pending';
        return 'completed';
    }

    async function loadData() {
        try {
            const [sr, er] = await Promise.all([fetch(API + '/serviceRecords'), fetch(API + '/elders')]);
            allRecords = ((await sr.json()).data || []).sort((a, b) => new Date(b.serviceTime) - new Date(a.serviceTime));
            allElders = (await er.json()).data || [];
            renderTable(allRecords);
            updateStats();
            document.getElementById('filterElder').innerHTML = '<option value="">全部老人</option>' + allElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
            document.getElementById('elderList').innerHTML = allElders.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        } catch(e) { showToast('加载失败', 'error'); }
    }

    function renderTable(records) {
        const tbody = document.getElementById('serviceBody');
        const elderMap = new Map(allElders.map(e => [e.id, e.name]));
        if (!records.length) { tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:40px;">暂无服务记录</td></tr>'; return; }
        tbody.innerHTML = records.map(r => {
            const status = getServiceStatus(r.serviceTime, r.duration);
            const statusText = { 'waiting': '待进行', 'pending': '进行中', 'completed': '已完成', 'unknown': '未知' }[status] || '未知';
            const statusClass = { 'waiting': 'status-waiting', 'pending': 'status-pending', 'completed': 'status-completed' }[status] || '';
            return `<tr><td>${r.id}</td><td>${(r.elderId||'').replace(/[&<>]/g,'')}</td><td>${(elderMap.get(r.elderId)||'未知').replace(/[&<>]/g,'')}</td><td>${(r.serviceType||'').replace(/[&<>]/g,'')}</td><td>${(r.servicePerson||'').replace(/[&<>]/g,'')}</td><td>${(r.serviceTime||'').replace('T',' ')}</td><td>${(r.duration||30)}分钟</td><td title="${(r.content||'').replace(/[&<>]/g,'')}">${(r.content||'-').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m])}</td><td class="${statusClass}">${statusText}</td><td><button class="edit-btn" onclick="editRecord(${r.id})">编辑</button><button class="delete-btn" onclick="deleteRecord(${r.id})">删除</button></td></tr>`;
        }).join('');
    }

    function updateStats() {
        let waiting = 0, pending = 0, completed = 0;
        allRecords.forEach(r => { const s = getServiceStatus(r.serviceTime, r.duration); if (s === 'waiting') waiting++; else if (s === 'pending') pending++; else if (s === 'completed') completed++; });
        document.getElementById('totalCount').innerText = allRecords.length;
        document.getElementById('waitingCount').innerHTML = waiting + '<span style="font-size:14px;"> + ' + pending + '进行中</span>';
        document.getElementById('completedCount').innerText = completed;
    }

    async function saveRecord() {
        const editId = document.getElementById('editId').value;
        const elderId = document.getElementById('elderId').value.trim();
        const servicePerson = document.getElementById('servicePerson').value;
        const serviceTime = document.getElementById('serviceTime').value;
        if (!elderId) { showToast('请填写老人编号', 'error'); return; }
        if (!servicePerson) { showToast('请选择服务人员', 'error'); return; }
        if (!serviceTime) { showToast('请选择服务时间', 'error'); return; }
        if (!allElders.some(e => e.id === elderId)) { showToast('老人编号不存在', 'error'); return; }
        const data = { elderId, serviceType: document.getElementById('serviceType').value, servicePerson, serviceTime, duration: parseInt(document.getElementById('duration').value) || 30, content: document.getElementById('content').value };
        try {
            if (editId) await fetch(API + '/serviceRecords?id=' + editId, { method: 'DELETE' });
            const res = await fetch(API + '/serviceRecords', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if ((await res.json()).code === 200) { showToast(editId ? '更新成功' : '添加成功', 'success'); resetForm(); loadData(); } else showToast('操作失败', 'error');
        } catch(e) { showToast('保存失败', 'error'); }
    }

    function editRecord(id) {
        const r = allRecords.find(x => x.id === id);
        if (r) {
            document.getElementById('editId').value = r.id; document.getElementById('elderId').value = r.elderId;
            document.getElementById('serviceType').value = r.serviceType; document.getElementById('servicePerson').value = r.servicePerson;
            document.getElementById('serviceTime').value = r.serviceTime; document.getElementById('duration').value = r.duration || 30;
            document.getElementById('content').value = r.content || '';
            window.scrollTo({ top: 0, behavior: 'smooth' }); showToast('正在编辑记录', 'warning');
        }
    }

    async function deleteRecord(id) {
        if (!confirm('确定删除？')) return;
        try {
            await fetch(API + '/serviceRecords?id=' + id, { method: 'DELETE' });
            showToast('删除成功', 'success'); loadData();
            if (document.getElementById('editId').value == id) resetForm();
        } catch(e) { showToast('删除失败', 'error'); }
    }

    function resetForm() {
        document.getElementById('editId').value = ''; document.getElementById('elderId').value = '';
        document.getElementById('serviceType').value = '上门测血压'; document.getElementById('servicePerson').value = '';
        document.getElementById('serviceTime').value = new Date().toISOString().slice(0, 16);
        document.getElementById('duration').value = '30'; document.getElementById('content').value = '';
    }

    function filterRecords() { renderRules(document.getElementById('filterElder').value ? allRecords.filter(r => r.elderId === document.getElementById('filterElder').value) : allRecords); }
    async function clearAllRecords() {
    if (!confirm('⚠️ 确定要删除所有服务记录吗？此操作不可恢复！')) return;
    try {
        const res = await fetch(API + '/serviceRecords/all', { method: 'DELETE' });
        const result = await res.json();
        if (result.code === 200) { showToast(result.msg, 'success'); loadData(); }
        else showToast('清除失败', 'error');
    } catch(e) { showToast('清除失败', 'error'); }
}
    document.getElementById('saveBtn').onclick = saveRecord;
    document.getElementById('resetBtn').onclick = resetForm;
    document.getElementById('serviceTime').value = new Date().toISOString().slice(0, 16);
    
    async function init() { displayUserInfo(); await loadWorkers(); await loadData(); }
    init();
</script>
</body>
</html>

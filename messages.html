<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲情留言 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.7); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .dropbtn:hover { background: #1e3a8a; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .dropdown-content a:hover { background: #f0f2f5; padding-left: 20px; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-menu a:hover { background: #1e3a8a; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-menu button:hover { background: #1e3a8a; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c5282; margin-bottom: 20px; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        
        .stats { background: #e8f4f8; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; color: #2c5282; font-size: 14px; }
        
        .message-list { max-height: 500px; overflow-y: auto; margin-bottom: 20px; }
        .message-item { background: #f8f9fc; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #2c5282; transition: all 0.3s; position: relative; }
        .message-item:hover { transform: translateX(5px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .message-header { display: flex; justify-content: space-between; color: #666; font-size: 12px; margin-bottom: 8px; }
        .message-from { font-weight: 600; color: #2c5282; }
        .message-time { color: #999; }
        .message-content { font-size: 15px; color: #333; line-height: 1.5; padding-right: 60px; }
        .delete-message-btn { position: absolute; right: 15px; top: 15px; background: #ff4d4f; color: white; border: none; border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
        .delete-message-btn:hover { background: #e03a3c; }
        .empty-message { text-align: center; padding: 40px; color: #999; }
        
        .input-area { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .input-area select { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: white; cursor: pointer; }
        .input-area input { flex: 2; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .input-area button { padding: 12px 24px; background: #2c5282; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .input-area button:hover { background: #1e3a8a; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10000; }
        .modal-content { background: white; border-radius: 16px; padding: 25px; width: 320px; text-align: center; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .modal-confirm { background: #ff4d4f; color: white; }
        .modal-cancel { background: #ccc; color: #333; }
        
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; display: none; z-index: 9999; }
        .toast.show { display: block; }
        .toast.success { background: #52c41a; }
        .toast.error { background: #ff4d4f; }
        .toast.warning { background: #faad14; }
        
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } .input-area { flex-direction: column; } .message-content { padding-right: 0; } .delete-message-btn { position: relative; right: auto; top: auto; margin-top: 10px; width: 100%; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2>💬 亲情留言板</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; background:#e8f4f8; padding:10px 15px; border-radius:8px; margin-bottom:20px;">
    <span id="stats" style="color:#2c5282; font-size:14px;">加载中...</span>
    <button onclick="clearAllMessages()" style="background:#e53e3e; color:white; border:none; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;">🗑️ 清除所有</button>
</div>
        <div class="message-list" id="messageList"><div class="empty-message">加载中...</div></div>
        <div class="input-area">
            <select id="elderSelect"><option value="">-- 请选择老人 --</option></select>
            <input type="text" id="messageContent" placeholder="写下您想对老人说的话..." maxlength="500">
            <button id="sendBtn">📤 发送</button>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content">
        <p>⚠️ 确定要删除这条留言吗？</p>
        <div class="modal-buttons"><button class="modal-btn modal-confirm" id="confirmDeleteBtn">确认删除</button><button class="modal-btn modal-cancel" id="cancelDeleteBtn">取消</button></div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let allElders = [], allMessages = [], pendingDeleteId = null;

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); setTimeout(() => window.location.href = 'login.html', 500); }
    function showToast(msg, type) { const t = document.getElementById('toast'); t.innerText = msg; t.className = `toast ${type} show`; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康管理 ▼</button><div class="dropdown-content"><a href="add.html">健康录入</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    }

    async function loadElders() {
        try {
            const res = await fetch(`${API}/elders`);
            const result = await res.json();
            if (result.code === 200) {
                allElders = result.data || [];
                document.getElementById('elderSelect').innerHTML = '<option value="">-- 请选择老人 --</option>' + allElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
            }
        } catch(e) { showToast('加载老人数据失败', 'error'); }
    }

    async function loadMessages() {
        try {
            const res = await fetch(`${API}/messages`);
            const result = await res.json();
            if (result.code === 200) {
                allMessages = result.data || [];
                if (role === 'family') allMessages = allMessages.filter(m => m.fromId === user.username);
                allMessages.sort((a, b) => new Date(b.createTime) - new Date(a.createTime));
                renderMessages();
                document.getElementById('stats').innerHTML = `📊 共有 ${allElders.length} 位老人，${allMessages.length} 条留言`;
            }
        } catch(e) { showToast('加载留言失败', 'error'); }
    }
    
    function renderMessages() {
        const container = document.getElementById('messageList');
        const elderMap = new Map(allElders.map(e => [e.id, e.name]));
        if (!allMessages.length) { container.innerHTML = '<div class="empty-message">💬 暂无留言</div>'; return; }
        container.innerHTML = allMessages.map(m => {
            const canDelete = (role === 'admin' || m.fromId === user.username);
            return `<div class="message-item">
                <div class="message-header"><span class="message-from">👤 ${m.fromId.replace(/[&<>]/g,'')} → 👴 ${(elderMap.get(m.toElderId)||m.toElderId).replace(/[&<>]/g,'')}</span><span class="message-time">${formatTime(m.createTime)}</span></div>
                <div class="message-content">${m.content.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m])}</div>
                ${canDelete ? `<button class="delete-message-btn" onclick="showDeleteConfirm(${m.id})">🗑️ 删除</button>` : ''}
            </div>`;
        }).join('');
    }
    
    function showDeleteConfirm(id) { pendingDeleteId = id; document.getElementById('deleteModal').style.display = 'flex'; }
    function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; pendingDeleteId = null; }
    async function confirmDelete() {
        if (!pendingDeleteId) { closeDeleteModal(); return; }
        try {
            const res = await fetch(`${API}/messages?id=${pendingDeleteId}`, { method: 'DELETE' });
            if ((await res.json()).code === 200) { showToast('删除成功', 'success'); await loadMessages(); }
            else showToast('删除失败', 'error');
        } catch(e) { showToast('删除失败', 'error'); }
        closeDeleteModal();
    }
    
    function formatTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        const now = new Date();
        if (date.toDateString() === now.toDateString()) return `今天 ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
        if (date.toDateString() === yesterday.toDateString()) return `昨天 ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
        return `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    }

    async function sendMessage() {
        const elderId = document.getElementById('elderSelect').value;
        const content = document.getElementById('messageContent').value.trim();
        if (!elderId) { showToast('请选择老人', 'warning'); return; }
        if (!content) { showToast('请输入内容', 'warning'); return; }
        try {
            const res = await fetch(`${API}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fromId: user.username, toElderId: elderId, content, type: 'text' }) });
            if ((await res.json()).code === 200) { showToast('发送成功', 'success'); document.getElementById('messageContent').value = ''; await loadMessages(); }
            else showToast('发送失败', 'error');
        } catch(e) { showToast('发送失败', 'error'); }
    }
    async function clearAllMessages() {
    if (!confirm('⚠️ 确定要删除所有留言吗？此操作不可恢复！')) return;
    try {
        const res = await fetch(`${API}/messages/all`, { method: 'DELETE' });
        const result = await res.json();
        if (result.code === 200) { showToast(result.msg, 'success'); loadMessages(); }
        else showToast('清除失败', 'error');
    } catch(e) { showToast('清除失败', 'error'); }
}

    displayUserInfo();
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
    document.getElementById('cancelDeleteBtn').onclick = closeDeleteModal;
    document.getElementById('deleteModal').onclick = function(e) { if (e.target === this) closeDeleteModal(); };
    document.getElementById('messageContent').onkeypress = function(e) { if (e.key === 'Enter') sendMessage(); };
    
    loadElders();
    loadMessages();
    setInterval(loadMessages, 30000);
</script>
</body>
</html>

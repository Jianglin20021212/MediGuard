<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>老人信息管理 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1562564055-71e051d33c19?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .page-header { margin-bottom: 25px; }
        .page-header h2 { color: #2c5282; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        
        .search-bar { background: white; padding: 16px 24px; border-radius: 16px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .search-input-group { display: flex; gap: 12px; flex: 2; min-width: 300px; }
        .search-input-group input { flex: 1; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; transition: all 0.3s; }
        .search-input-group input:focus { outline: none; border-color: #2c5282; box-shadow: 0 0 0 3px rgba(44,82,130,0.1); }
        .search-input-group button { padding: 10px 24px; background: #2c5282; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .search-input-group button:hover { background: #1e3a8a; }
        .refresh-btn { padding: 10px 24px; background: #e2e8f0; color: #2c5282; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .refresh-btn:hover { background: #cbd5e1; }
        
        .form-card { background: white; border-radius: 20px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-header { padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .form-header h3 { color: #2c5282; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .form-body { padding: 24px; }
        .form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 13px; }
        .form-group label .required { color: #e53e3e; }
        .form-group input { padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #2c5282; box-shadow: 0 0 0 3px rgba(44,82,130,0.1); }
        .form-actions { display: flex; gap: 12px; margin-top: 10px; }
        .btn-save { padding: 10px 28px; background: #2c5282; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn-save:hover { background: #1e3a8a; }
        .btn-reset { padding: 10px 28px; background: #e2e8f0; color: #475569; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn-reset:hover { background: #cbd5e1; }
        
        .table-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 14px 16px; background: #f8fafc; color: #2c5282; font-weight: 600; font-size: 14px; border-bottom: 2px solid #e2e8f0; text-align: center; }
        td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155; text-align: center; }
        td:nth-child(5), td:nth-child(6) { text-align: center !important; max-width: 200px; word-break: break-word; white-space: normal; line-height: 1.4; }
        tr:hover td { background: #f8fafc; }
        
        .edit-btn { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin: 0 4px; transition: all 0.3s; }
        .edit-btn:hover { background: #2563eb; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin: 0 4px; transition: all 0.3s; }
        .delete-btn:hover { background: #dc2626; }
        .empty-row td { text-align: center; padding: 60px; color: #94a3b8; }
        
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 10px; color: white; display: none; z-index: 9999; font-size: 14px; }
        .toast.show { display: block; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        
        @media (max-width: 900px) { .form-row { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } .search-bar { flex-direction: column; align-items: stretch; } .search-input-group { flex-direction: column; } th, td { padding: 8px 12px; font-size: 12px; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <div class="page-header"><h2>👥 老人信息管理</h2></div>
    
    <div class="search-bar">
        <div class="search-input-group">
            <input type="text" id="searchInput" placeholder="🔍 搜索编号或姓名...">
            <button onclick="searchElder()">搜索</button>
        </div>
        <button class="refresh-btn" onclick="loadElders()">🔄 刷新</button>
<button onclick="clearAllElders()" style="padding:10px 24px; background:#e53e3e; color:white; border:none; border-radius:10px; cursor:pointer; font-size:14px;">🗑️ 清除所有老人</button>
    </div>
    
    <div class="form-card">
        <div class="form-header"><h3>📝 <span id="formTitle">添加新老人</span></h3></div>
        <div class="form-body">
            <input type="hidden" id="editId">
            <div class="form-row">
                <div class="form-group"><label>编号 <span class="required">*</span></label><input type="text" id="newId" placeholder="如：1003"></div>
                <div class="form-group"><label>姓名 <span class="required">*</span></label><input type="text" id="newName" placeholder="姓名"></div>
                <div class="form-group"><label>年龄 <span class="required">*</span></label><input type="number" id="newAge" placeholder="年龄"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>电话 <span class="required">*</span></label><input type="text" id="newPhone" placeholder="手机号"></div>
                <div class="form-group"><label>地址</label><input type="text" id="newAddr" placeholder="地址"></div>
                <div class="form-group"><label>备注</label><input type="text" id="newRemark" placeholder="备注"></div>
            </div>
            <div class="form-actions"><button class="btn-save" id="saveBtn">💾 保存</button><button class="btn-reset" id="resetBtn">🔄 重置</button></div>
        </div>
    </div>
    
    <div class="table-card">
        <div class="table-wrapper">
            <table>
                <thead><tr><th style="width:10%">编号</th><th style="width:10%">姓名</th><th style="width:8%">年龄</th><th style="width:15%">电话</th><th style="width:22%">地址</th><th style="width:20%">备注</th><th style="width:15%">操作</th></tr></thead>
                <tbody id="elderTableBody"><tr class="empty-row"><td colspan="7">📋 加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let allElders = [];

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }
    function showToast(msg, type) { const t = document.getElementById('toast'); t.innerText = msg; t.className = `toast ${type} show`; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="list.html">添加老人</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康管理 ▼</button><div class="dropdown-content"><a href="add.html">健康录入</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    }

    async function loadElders() {
        try {
            const res = await fetch(`${API}/elders`);
            allElders = ((await res.json()).data || []);
            renderTable(allElders);
        } catch(e) { showToast('加载失败', 'error'); }
    }

    function renderTable(elders) {
        const tbody = document.getElementById('elderTableBody');
        if (!elders.length) { tbody.innerHTML = '<tr class="empty-row"><td colspan="7">📋 暂无老人数据，请点击上方添加</td></tr>'; return; }
        tbody.innerHTML = elders.map(e => `<tr>
            <td>${e.id}</td><td>${e.name}</td><td>${e.age}</td><td>${e.phone}</td>
            <td style="text-align:left;">${e.address||'-'}</td><td style="text-align:left;">${e.remark||'-'}</td>
            <td style="white-space: nowrap;"><button class="edit-btn" onclick="editElder('${e.id}')">编辑</button><button class="delete-btn" onclick="deleteElder('${e.id}')">删除</button></td>
        </tr>`).join('');
    }

    async function saveElder() {
        const id = document.getElementById('newId').value.trim();
        const name = document.getElementById('newName').value.trim();
        const age = document.getElementById('newAge').value;
        const phone = document.getElementById('newPhone').value.trim();
        const address = document.getElementById('newAddr').value.trim();
        const remark = document.getElementById('newRemark').value.trim();
        const editId = document.getElementById('editId').value;
        if (!id || !name || !age || !phone) { showToast('请填写完整信息', 'error'); return; }
        try {
            let method = editId ? 'PUT' : 'POST';
            const res = await fetch(`${API}/elders`, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, name, age: parseInt(age), phone, address, remark }) });
            if ((await res.json()).code === 200) { showToast(editId ? '修改成功' : '添加成功', 'success'); resetForm(); loadElders(); }
            else showToast('操作失败', 'error');
        } catch(e) { showToast('保存失败', 'error'); }
    }

    function editElder(id) {
        const e = allElders.find(x => x.id === id);
        if (e) {
            document.getElementById('newId').value=e.id; document.getElementById('newName').value=e.name;
            document.getElementById('newAge').value=e.age; document.getElementById('newPhone').value=e.phone;
            document.getElementById('newAddr').value=e.address||''; document.getElementById('newRemark').value=e.remark||'';
            document.getElementById('editId').value=id; document.getElementById('formTitle').innerHTML='✏️ 编辑老人信息';
            window.scrollTo({top:0,behavior:'smooth'});
        }
    }

    function resetForm() {
        document.getElementById('newId').value=''; document.getElementById('newName').value='';
        document.getElementById('newAge').value=''; document.getElementById('newPhone').value='';
        document.getElementById('newAddr').value=''; document.getElementById('newRemark').value='';
        document.getElementById('editId').value=''; document.getElementById('formTitle').innerHTML='添加新老人';
    }

    async function clearAllElders() {
    if (!confirm('⚠️ 确定要删除所有老人吗？此操作不可恢复！')) return;
    if (!confirm('再次确认：真的要删除所有老人吗？')) return;
    try {
        const res = await fetch(`${API}/elders/all`, { method: 'DELETE' });
        const result = await res.json();
        if (result.code === 200) { showToast(result.msg, 'success'); loadElders(); }
        else showToast('清除失败', 'error');
    } catch(e) { showToast('清除失败', 'error'); }
}

    async function deleteElder(id) { if (!confirm('确定删除？')) return; await fetch(`${API}/elders?id=${id}`, { method: 'DELETE' }); showToast('删除成功', 'success'); loadElders(); }
    function searchElder() { const kw = document.getElementById('searchInput').value.trim().toLowerCase(); renderTable(kw ? allElders.filter(e => e.id.includes(kw) || e.name.includes(kw)) : allElders); }

    displayUserInfo();
    document.getElementById('saveBtn').onclick=saveElder;
    document.getElementById('resetBtn').onclick=resetForm;
    loadElders();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统设置 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #2c5282; margin-bottom: 20px; }
        .form-item { margin-bottom: 20px; }
        .form-item label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-item input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { padding: 12px 24px; background: #2c5282; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 16px; transition: all 0.3s; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: #e53e3e; }
        .btn-danger:hover { background: #c53030; }
        .btn-outline-danger { background: white; color: #e53e3e; border: 2px solid #e53e3e; }
        .btn-outline-danger:hover { background: #fff5f5; }
        
        .divider { border-top: 1px solid #eee; margin: 20px 0; padding-top: 20px; }
        .danger-zone { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 10px; padding: 18px; }
        .danger-zone h3 { color: #e53e3e; font-size: 16px; margin-bottom: 8px; }
        .danger-zone p { color: #666; font-size: 13px; margin-bottom: 12px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: white; border-radius: 16px; padding: 30px; width: 380px; max-width: 90%; text-align: center; }
        .modal-content h3 { color: #e53e3e; margin-bottom: 10px; }
        .modal-content p { color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
        .modal-content input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; }
        .modal-confirm { background: #e53e3e; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }
        .modal-cancel { background: #e2e8f0; color: #333; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: white; display: none; z-index: 9999; }
        .toast.show { display: block; }
        .toast.success { background: #52c41a; }
        .toast.error { background: #e53e3e; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2>⚙️ 账号设置</h2>
        <div class="form-item"><label>当前用户名</label><input type="text" id="currentUsername" readonly style="background:#f5f5f5;"></div>
        <div class="form-item"><label>新用户名</label><input type="text" id="newUsername" placeholder="留空则不修改"></div>
        <div class="form-item"><label>当前密码</label><input type="password" id="oldPwd" placeholder="请输入当前密码"></div>
        <div class="form-item"><label>新密码</label><input type="password" id="newPwd" placeholder="留空则不修改（至少6位）"></div>
        <button id="saveBtn">💾 保存设置</button>
        <button id="logoutBtn" class="btn-outline-danger">🚪 退出登录</button>
        
        <div class="divider"></div>
        
        <div class="danger-zone">
            <h3>⚠️ 危险操作</h3>
            <p>注销账号后，该账号的所有数据将被永久删除，无法恢复。请谨慎操作。</p>
            <button class="btn-danger" onclick="showDeleteAccountModal()">🗑️ 注销该账号</button>
        </div>
    </div>
</div>

<!-- 确认注销弹窗 -->
<div id="deleteAccountModal" class="modal">
    <div class="modal-content">
        <h3>⚠️ 确认注销账号</h3>
        <p>此操作不可逆！请输入 "<strong>确认注销</strong>" 以继续：</p>
        <input type="text" id="deleteConfirmText" placeholder='请输入"确认注销"'>
        <div class="modal-buttons">
            <button class="modal-cancel" onclick="closeDeleteAccountModal()">取消</button>
            <button class="modal-confirm" onclick="deleteAccount()">确认注销</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let currentUsername = user.username;

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 2000); }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    const navMenu = document.getElementById('navMenu');
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="list.html">添加老人</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康管理 ▼</button><div class="dropdown-content"><a href="add.html">健康录入</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    }

    async function saveSetting() {
        const oldPwd = document.getElementById('oldPwd').value;
        const newPwd = document.getElementById('newPwd').value;
        const newUsername = document.getElementById('newUsername').value.trim();
        if (!oldPwd) { showToast('请输入当前密码'); return; }
        try {
            const verify = await fetch(`${API}/loginByRole`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUsername, password: oldPwd, role }) });
            if ((await verify.json()).code !== 200) { showToast('当前密码错误'); return; }
            const update = { currentUsername };
            if (newUsername && newUsername !== currentUsername) update.newUsername = newUsername;
            if (newPwd) { if (newPwd.length < 6) { showToast('新密码至少6位'); return; } update.newPassword = newPwd; }
            if (Object.keys(update).length === 1) { showToast('没有修改任何信息'); return; }
            const res = await fetch(`${API}/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(update) });
            if ((await res.json()).code === 200) {
                if (newUsername) { user.username = newUsername; localStorage.setItem('currentUser', JSON.stringify(user)); currentUsername = newUsername; }
                showToast('保存成功');
                document.getElementById('oldPwd').value = ''; document.getElementById('newPwd').value = '';
                document.getElementById('newUsername').value = ''; document.getElementById('currentUsername').value = currentUsername;
            } else showToast('保存失败');
        } catch(e) { showToast('服务器错误'); }
    }

    // ========== 注销账号功能 ==========
    function showDeleteAccountModal() {
        document.getElementById('deleteAccountModal').style.display = 'flex';
        document.getElementById('deleteConfirmText').value = '';
    }
    function closeDeleteAccountModal() {
        document.getElementById('deleteAccountModal').style.display = 'none';
    }
    
    async function deleteAccount() {
        const confirmText = document.getElementById('deleteConfirmText').value.trim();
        if (confirmText !== '确认注销') {
            showToast('请输入"确认注销"以确认操作');
            return;
        }
        try {
            // 先请求用户输入密码确认
            const password = prompt('请输入当前密码以确认注销：');
            if (!password) return;
            
            // 验证密码
            const verify = await fetch(`${API}/loginByRole`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ username: currentUsername, password: password, role }) 
            });
            if ((await verify.json()).code !== 200) { 
                showToast('密码错误，注销失败'); 
                return; 
            }
            
            // 向后端请求删除账号
            const res = await fetch(`${API}/deleteAccount`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ username: currentUsername, password: password }) 
            });
            const result = await res.json();
            
            if (result.code === 200) {
                closeDeleteAccountModal();
                localStorage.removeItem('currentUser');
                showToast('账号已注销，即将跳转...');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } else {
                showToast(result.msg || '注销失败');
            }
        } catch(e) { 
            showToast('服务器错误，注销失败'); 
        }
    }

    // 关闭弹窗（点击背景）
    document.getElementById('deleteAccountModal').onclick = function(e) {
        if (e.target === this) closeDeleteAccountModal();
    };

    displayUserInfo();
    document.getElementById('currentUsername').value = currentUsername;
    document.getElementById('saveBtn').onclick = saveSetting;
    document.getElementById('logoutBtn').onclick = logout;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>绑定老人 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #2c5282; margin-bottom: 20px; }
        .form-item { margin-bottom: 20px; }
        .form-item label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-item input, .form-item select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 12px 24px; background: #2c5282; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
        .bind-list { margin-top: 20px; }
        .bind-item { background: #f8f9fc; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .badge { background: #2c5282; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .unbind-btn { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: white; display: none; z-index: 9999; }
        .toast.show { display: block; }
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <div class="card">
        <h2>🔗 绑定老人</h2>
        <div class="form-item"><label>老人编号</label><input type="text" id="elderId" placeholder="请输入老人编号，如：1001"></div>
        <div class="form-item"><label>关系</label><select id="relation"><option>父亲</option><option>母亲</option><option>爷爷</option><option>奶奶</option><option>外公</option><option>外婆</option><option>其他</option></select></div>
        <button id="bindBtn">确认绑定</button>
    </div>
    <div class="card">
        <h2>📋 已绑定的老人</h2>
        <div id="bindList" class="bind-list">加载中...</div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    if (role !== 'family') { alert('此页面仅限家属访问'); window.location.href = 'index.html'; }

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); location.href = 'login.html'; }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
        <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
        <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
        <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
        <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
        <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
        <button onclick="logout()">退出登录</button>`;

    async function loadBindings() {
        try {
            const res = await fetch(`${API}/elders`);
            const elders = (await res.json()).data || [];
            let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
            const container = document.getElementById('bindList');
            if (!bindings.length) { container.innerHTML = '<div style="text-align:center;padding:20px;">暂无绑定老人</div>'; return; }
            container.innerHTML = bindings.map(b => {
                const elder = elders.find(e => e.id === b.elderId);
                return `<div class="bind-item"><div><strong>${elder ? elder.name : b.elderId}</strong>（编号：${b.elderId}）<span class="badge">${b.relation}</span><span style="color:#999;margin-left:10px;">绑定时间：${b.bindTime}</span></div><button class="unbind-btn" onclick="unbind('${b.elderId}')">解绑</button></div>`;
            }).join('');
        } catch(e) { showToast('加载失败'); }
    }

    async function bindElder() {
        const elderId = document.getElementById('elderId').value.trim();
        const relation = document.getElementById('relation').value;
        if (!elderId) { showToast('请输入老人编号'); return; }
        const res = await fetch(`${API}/elders`);
        const elders = (await res.json()).data || [];
        if (!elders.find(e => e.id === elderId)) { showToast('老人编号不存在'); return; }
        let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
        if (bindings.find(b => b.elderId === elderId)) { showToast('该老人已绑定'); return; }
        bindings.push({ elderId, relation, bindTime: new Date().toLocaleString() });
        localStorage.setItem(`bind_${user.username}`, JSON.stringify(bindings));
        showToast('绑定成功');
        document.getElementById('elderId').value = '';
        loadBindings();
    }

    function unbind(elderId) {
        if (confirm('确定解绑？')) {
            let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
            bindings = bindings.filter(b => b.elderId !== elderId);
            localStorage.setItem(`bind_${user.username}`, JSON.stringify(bindings));
            showToast('解绑成功');
            loadBindings();
        }
    }

    displayUserInfo();
    document.getElementById('bindBtn').onclick = bindElder;
    loadBindings();
</script>
</body>
</html>

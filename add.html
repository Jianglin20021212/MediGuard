<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康数据录入 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1666214280557-f1b5022eb634?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #2c5282; margin-bottom: 20px; font-size: 24px; }
        
        .form-box, .history-box { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #2c5282; border-left: 4px solid #2c5282; padding-left: 12px; }
        
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-item label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
        .form-item input, .form-item select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: all 0.3s; }
        .form-item input:focus, .form-item select:focus { outline: none; border-color: #2c5282; box-shadow: 0 0 0 2px rgba(44,82,130,0.1); }
        
        .btn-primary { padding: 10px 25px; background: #2c5282; color: white; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; transition: all 0.3s; }
        .btn-primary:hover { background: #1e3a8a; transform: translateY(-1px); }
        .btn-secondary { padding: 10px 25px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover { background: #5a6268; transform: translateY(-1px); }
        
        .search-bar { margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
        .search-bar input { padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; width: 250px; }
        .search-bar button { padding: 10px 20px; background: #2c5282; color: white; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .search-bar button:hover { background: #1e3a8a; }
        
        .table-wrapper { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; min-width: 1200px; border-collapse: collapse; background: white; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        th { background: #2c5282; color: white; font-weight: 600; position: sticky; top: 0; }
        tr:hover { background: #f8f9fa; }
        td:nth-child(11), th:nth-child(11) { text-align: left; }
        td:last-child, th:last-child { text-align: center; }
        
        .edit-btn { background: #1890ff; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; margin: 0 3px; transition: all 0.3s; }
        .edit-btn:hover { background: #0c7cd5; }
        .delete-btn { background: #ff4d4f; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; margin: 0 3px; transition: all 0.3s; }
        .delete-btn:hover { background: #e03a3c; }
        
        .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: white; display: none; z-index: 9999; animation: slideDown 0.3s ease; }
        .toast.show { display: block; }
        .toast.success { background: #52c41a; }
        .toast.error { background: #ff4d4f; }
        .toast.warning { background: #faad14; }
        
        @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        @media (max-width: 768px) { .navbar { flex-direction: column; gap: 15px; } .form-row { grid-template-columns: 1fr; } .search-bar { justify-content: flex-start; } }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>

<div class="container">
    <h2>📊 健康数据录入</h2>
    
    <div class="form-box">
        <div class="form-title">➕ 新增/编辑健康数据</div>
        <input type="hidden" id="editId">
        <div class="form-row">
            <div class="form-item"><label>* 老人编号</label><input type="text" id="elderId" placeholder="如：1001" list="elderList"><datalist id="elderList"></datalist></div>
            <div class="form-item"><label>* 测量日期</label><input type="date" id="measureDate"></div>
            <div class="form-item"><label>收缩压 (mmHg)</label><input type="number" id="sysBP" placeholder="90-140" step="1"></div>
            <div class="form-item"><label>舒张压 (mmHg)</label><input type="number" id="diaBP" placeholder="60-90" step="1"></div>
        </div>
        <div class="form-row">
            <div class="form-item"><label>血糖 (mmol/L)</label><input type="number" id="bloodSugar" placeholder="3.9-6.1" step="0.1"></div>
            <div class="form-item"><label>心率 (次/分)</label><input type="number" id="heartRate" placeholder="60-100" step="1"></div>
            <div class="form-item"><label>体温 (℃)</label><input type="number" id="temperature" placeholder="36.0-37.2" step="0.1"></div>
            <div class="form-item"><label>血氧 (%)</label><input type="number" id="spo2" placeholder="95-100" step="1" min="0" max="100"></div>
        </div>
        <div class="form-row">
            <div class="form-item"><label>体重 (kg)</label><input type="number" id="weight" placeholder="45-85" step="0.1"></div>
            <div class="form-item"><label>备注</label><input type="text" id="remark" placeholder="其他说明"></div>
        </div>
        <div><button class="btn-primary" id="saveBtn">💾 保存</button><button class="btn-secondary" id="resetBtn">🔄 重置</button></div>
    </div>
    
    <div class="history-box">
        <div class="form-title">📋 健康数据历史记录</div>
        <div class="search-bar">
    <input type="text" id="searchElderId" placeholder="🔍 输入老人编号查询">
    <button onclick="searchHistory()">查询</button>
    <button onclick="loadData()">刷新</button>
    <button onclick="clearAllData()" style="background:#e53e3e;">🗑️ 清除所有数据</button>
</div>
        <div class="table-wrapper">
            <table id="historyTable">
                <thead><tr><th width="8%">测量日期</th><th width="8%">老人编号</th><th width="8%">姓名</th><th width="7%">收缩压</th><th width="7%">舒张压</th><th width="7%">血糖</th><th width="6%">心率</th><th width="6%">体温</th><th width="6%">血氧</th><th width="6%">体重</th><th width="15%">备注</th><th width="16%">操作</th></tr></thead>
                <tbody id="historyBody"><tr><td colspan="12" style="text-align:center; padding:40px;">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let allData = [], allElders = [];

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); showToast('已退出登录', 'success'); setTimeout(() => window.location.href = 'login.html', 500); }
    function showToast(msg, type) { const t = document.getElementById('toast'); t.innerText = msg; t.className = `toast ${type} show`; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="list.html">添加老人</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康管理 ▼</button><div class="dropdown-content"><a href="add.html">健康录入</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="result.html">风险评估</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="warning.html">健康预警</a></div></div>
            <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
            <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
            <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
            <button onclick="logout()">退出登录</button>`;
    }

    async function loadData() {
        try {
            const [hr, er] = await Promise.all([fetch(`${API}/healthData`), fetch(`${API}/elders`)]);
            allData = ((await hr.json()).data || []).sort((a, b) => new Date(b.measureDate) - new Date(a.measureDate));
            allElders = (await er.json()).data || [];
            renderTable(allData);
            document.getElementById('elderList').innerHTML = allElders.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
        } catch(e) { showToast('加载失败', 'error'); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('historyBody');
        const elderMap = new Map(allElders.map(e => [e.id, e.name]));
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="12" style="text-align:center; padding:40px;">暂无数据</td></tr>'; return; }
        tbody.innerHTML = data.map(r => `<tr>
            <td>${r.measureDate||'-'}</td><td>${r.elderId}</td><td>${elderMap.get(r.elderId)||'未知'}</td>
            <td>${r.sysBP||'-'}</td><td>${r.diaBP||'-'}</td><td>${r.bloodSugar||'-'}</td>
            <td>${r.heartRate||'-'}</td><td>${r.temperature||'-'}</td><td>${r.spo2||'-'}</td>
            <td>${r.weight||'-'}</td><td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${(r.remark||'').replace(/[&<>]/g,'')}">${(r.remark||'-').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m])}</td>
            <td><button class="edit-btn" onclick="editRecord(${r.id})">编辑</button><button class="delete-btn" onclick="deleteRecord(${r.id})">删除</button></td>
        </tr>`).join('');
    }

    function searchHistory() { const id = document.getElementById('searchElderId').value.trim(); renderTable(id ? allData.filter(r => r.elderId === id) : allData); }

    async function saveData() {
        const elderId = document.getElementById('elderId').value.trim();
        const measureDate = document.getElementById('measureDate').value;
        if (!elderId) { showToast('请填写老人编号', 'error'); return; }
        if (!measureDate) { showToast('请选择测量日期', 'error'); return; }
        if (!allElders.some(e => e.id === elderId)) { showToast('老人编号不存在', 'error'); return; }
        const data = { elderId, measureDate, sysBP: document.getElementById('sysBP').value||null, diaBP: document.getElementById('diaBP').value||null, bloodSugar: document.getElementById('bloodSugar').value||null, heartRate: document.getElementById('heartRate').value||null, temperature: document.getElementById('temperature').value||null, spo2: document.getElementById('spo2').value||null, weight: document.getElementById('weight').value||null, remark: document.getElementById('remark').value||'' };
        try {
            const editId = document.getElementById('editId').value;
            if (editId) await fetch(`${API}/healthData?id=${editId}`, { method: 'DELETE' });
            const res = await fetch(`${API}/healthData`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if ((await res.json()).code === 200) { showToast(editId?'更新成功':'添加成功', 'success'); resetForm(); loadData(); } else showToast('操作失败', 'error');
        } catch(e) { showToast('保存失败', 'error'); }
    }

    function editRecord(id) {
        const r = allData.find(x => x.id === id);
        if (r) {
            document.getElementById('elderId').value=r.elderId; document.getElementById('measureDate').value=r.measureDate;
            document.getElementById('sysBP').value=r.sysBP||''; document.getElementById('diaBP').value=r.diaBP||'';
            document.getElementById('bloodSugar').value=r.bloodSugar||''; document.getElementById('heartRate').value=r.heartRate||'';
            document.getElementById('temperature').value=r.temperature||''; document.getElementById('spo2').value=r.spo2||'';
            document.getElementById('weight').value=r.weight||''; document.getElementById('remark').value=r.remark||'';
            document.getElementById('editId').value=r.id;
            window.scrollTo({top:0,behavior:'smooth'}); showToast('正在编辑记录', 'warning');
        }
    }

    async function deleteRecord(id) {
        if (!confirm('确定删除？')) return;
        try {
            await fetch(`${API}/healthData?id=${id}`, { method: 'DELETE' });
            showToast('删除成功', 'success'); loadData();
            if (document.getElementById('editId').value == id) resetForm();
        } catch(e) { showToast('删除失败', 'error'); }
    }

    async function clearAllData() {
    if (!confirm('⚠️ 确定要删除所有健康数据吗？此操作不可恢复！')) return;
    if (!confirm('再次确认：真的要删除所有健康数据吗？')) return;
    try {
        const res = await fetch(`${API}/healthData/all`, { method: 'DELETE' });
        const result = await res.json();
        if (result.code === 200) {
            showToast(result.msg, 'success');
            loadData();
        } else {
            showToast('清除失败', 'error');
        }
    } catch(e) { showToast('清除失败', 'error'); }
}

    function resetForm() {
        document.getElementById('elderId').value=''; document.getElementById('measureDate').value=new Date().toISOString().slice(0,10);
        document.getElementById('sysBP').value=''; document.getElementById('diaBP').value=''; document.getElementById('bloodSugar').value='';
        document.getElementById('heartRate').value=''; document.getElementById('temperature').value=''; document.getElementById('spo2').value='';
        document.getElementById('weight').value=''; document.getElementById('remark').value=''; document.getElementById('editId').value='';
    }

    displayUserInfo();
    document.getElementById('saveBtn').onclick=saveData;
    document.getElementById('resetBtn').onclick=resetForm;
    document.getElementById('measureDate').value=new Date().toISOString().slice(0,10);
    loadData();
</script>
</body>
</html>

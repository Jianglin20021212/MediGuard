<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>健康预警 | 老人健康监护系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body { 
            background: #f5f7fa;
            background-image: url('https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245,247,250,0.72); z-index: -1; }
        
        .navbar { background: #2c5282; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo i { font-size: 28px; }
        .logo span { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .dropbtn:hover { background: #1e3a8a; border-radius: 6px; }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 8px; z-index: 1; }
        .dropdown-content a { color: #2c5282 !important; padding: 10px 15px; display: block; text-decoration: none; font-size: 14px; }
        .dropdown-content a:hover { background: #f0f2f5; }
        .dropdown:hover .dropdown-content { display: block; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; }
        .nav-menu a:hover { background: #1e3a8a; border-radius: 6px; }
        .nav-menu button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px 12px; }
        .nav-menu button:hover { background: #1e3a8a; border-radius: 6px; }
        
        .user-info { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 40px; }
        .user-avatar { width: 32px; height: 32px; background: #ffd700; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #2c5282; font-weight: bold; font-size: 16px; }
        .user-details { display: flex; flex-direction: column; line-height: 1.3; }
        .user-name { font-weight: bold; font-size: 14px; }
        .user-role { font-size: 11px; opacity: 0.85; }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #2c5282; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #e53e3e; }
        .filter-bar { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: flex-end; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .filter-bar button { padding: 8px 20px; background: #2c5282; color: white; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .filter-bar button:hover { background: #1e3a8a; }
        
        .table-wrapper { overflow-x: auto; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 12px; overflow: hidden; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background: #2c5282; color: white; font-weight: 600; font-size: 14px; text-align: center; }
        td { font-size: 14px; color: #333; }
        tr:hover { background: #f8f9fc; }
        th:nth-child(1), td:nth-child(1) { text-align: center; }
        th:nth-child(2), td:nth-child(2) { text-align: center; }
        th:nth-child(3), td:nth-child(3) { text-align: center; }
        th:nth-child(4), td:nth-child(4) { text-align: center; }
        th:nth-child(5), td:nth-child(5) { text-align: center; }
        th:nth-child(6), td:nth-child(6) { text-align: left; }
        
        .danger { background: #e53e3e; color: white; padding: 4px 12px; border-radius: 20px; display: inline-block; font-size: 12px; font-weight: 500; }
        .warning { background: #ed8936; color: white; padding: 4px 12px; border-radius: 20px; display: inline-block; font-size: 12px; font-weight: 500; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 6px; color: white; display: none; z-index: 9999; }
        .toast.show { display: block; }
        
        @media (max-width: 768px) { 
            .navbar { flex-direction: column; gap: 15px; }
            .user-info { margin-left: 0; }
            .filter-bar { justify-content: flex-start; }
            th, td { padding: 10px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo" onclick="location.href='index.html'">
        <i>❤️</i>
        <span>老人健康监护系统</span>
    </div>
    <div class="nav-menu" id="navMenu"></div>
    <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-details">
            <span class="user-name" id="userName">加载中...</span>
            <span class="user-role" id="userRole">--</span>
        </div>
    </div>
</div>
<div class="container">
    <h2>⚠️ 健康预警</h2>
    <div class="stats">
        <div class="stat-card"><div class="number" id="totalAlerts">0</div><div>总预警数</div></div>
        <div class="stat-card"><div class="number" id="highRiskCount">0</div><div>高风险老人</div></div>
        <div class="stat-card"><div class="number" id="todayNew">0</div><div>今日新增</div></div>
    </div>
    <div class="filter-bar">
        <select id="elderSelect"><option value="">全部老人</option></select>
        <input type="date" id="startDate">
        <input type="date" id="endDate">
        <button onclick="filterAlerts()">🔍 筛选</button>
        <button onclick="loadData()">🔄 刷新</button>
    </div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="15%">📅 日期</th>
                    <th width="10%">🆔 编号</th>
                    <th width="10%">👤 姓名</th>
                    <th width="22%">⚠️ 异常项目</th>
                    <th width="18%">📊 数值</th>
                    <th width="25%">💡 建议</th>
                </tr>
            </thead>
            <tbody id="alertBody">
                <tr><td colspan="6" style="text-align:center; padding:40px;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API ='http://localhost:8080/api';
    const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!user.username) window.location.href = 'login.html';
    const role = user.role || 'admin';
    let allElders = [], allHealth = [], alerts = [];

    const roleNames = { 'admin': '👑 系统管理员', 'worker': '👨‍⚕️ 护工', 'family': '👨‍👩‍👧 家属' };
    const roleIcons = { 'admin': '👑', 'worker': '🩺', 'family': '💝' };

    function displayUserInfo() {
        document.getElementById('userName').innerText = user.username || '未知用户';
        document.getElementById('userRole').innerHTML = roleNames[role] || role;
        document.getElementById('userAvatar').innerHTML = roleIcons[role] || '👤';
    }

    function logout() { localStorage.removeItem('currentUser'); location.href = 'login.html'; }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.className = 'toast show'; setTimeout(() => t.className = 'toast', 2000); }

    const navMenu = document.getElementById('navMenu');
    const commonDropdowns = `
        <div class="dropdown"><button class="dropbtn">数据看板 ▼</button><div class="dropdown-content"><a href="dashboard.html">数据大屏</a><a href="ai_dashboard.html">AI预测</a><a href="warning.html">健康预警</a><a href="result.html">风险评估</a></div></div>
        <div class="dropdown"><button class="dropbtn">亲情留言 ▼</button><div class="dropdown-content"><a href="messages.html">查看留言</a><a href="messages.html">发送留言</a></div></div>
        <div class="dropdown"><button class="dropbtn">健康知识库 ▼</button><div class="dropdown-content"><a href="knowledge.html">健康知识库</a></div></div>
        <div class="dropdown"><button class="dropbtn">系统设置 ▼</button><div class="dropdown-content"><a href="setting.html">账号设置</a></div></div>
        <button onclick="logout()">退出登录</button>
    `;
    if (role === 'admin') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人列表</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">服务管理 ▼</button><div class="dropdown-content"><a href="service.html">服务记录</a><a href="orders.html">订单管理</a></div></div>
            ${commonDropdowns}`;
    } else if (role === 'worker') {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人管理 ▼</button><div class="dropdown-content"><a href="list.html">老人信息</a><a href="add.html">健康录入</a></div></div>
            <div class="dropdown"><button class="dropbtn">订单管理 ▼</button><div class="dropdown-content"><a href="orders.html">待接单</a><a href="service.html">服务记录</a></div></div>
            ${commonDropdowns}`;
    } else {
        navMenu.innerHTML = `<a href="index.html">🏠 首页</a>
            <div class="dropdown"><button class="dropbtn">老人服务 ▼</button><div class="dropdown-content"><a href="family_bind.html">绑定老人</a><a href="accompany.html">一键陪诊</a><a href="orders.html">我的订单</a><a href="messages.html">亲情留言</a></div></div>
            ${commonDropdowns}`;
    }

    function checkAlert(r) {
        const items = [];
        const s = parseFloat(r.sysBP);
        if (s >= 140) items.push({ type: 'danger', item: '收缩压偏高', value: s + ' mmHg', suggest: '建议就医，控制血压' });
        else if (s <= 90 && s > 0) items.push({ type: 'warning', item: '收缩压偏低', value: s + ' mmHg', suggest: '注意营养，适当休息' });
        const b = parseFloat(r.bloodSugar);
        if (b >= 7.0) items.push({ type: 'danger', item: '血糖偏高', value: b + ' mmol/L', suggest: '控制饮食，监测血糖' });
        else if (b <= 3.9 && b > 0) items.push({ type: 'warning', item: '血糖偏低', value: b + ' mmol/L', suggest: '及时补充糖分' });
        const h = parseFloat(r.heartRate);
        if (h >= 100) items.push({ type: 'warning', item: '心率过快', value: h + ' 次/分', suggest: '休息后复测' });
        else if (h <= 50 && h > 0) items.push({ type: 'warning', item: '心率过缓', value: h + ' 次/分', suggest: '关注身体状况' });
        const t = parseFloat(r.temperature);
        if (t >= 37.3) items.push({ type: 'danger', item: '发热', value: t + ' ℃', suggest: '就医检查' });
        const o = parseFloat(r.spo2);
        if (o <= 94 && o > 0) items.push({ type: 'danger', item: '血氧偏低', value: o + ' %', suggest: '及时就医检查' });
        return items;
    }

    async function loadData() {
        try {
            const [er, hr] = await Promise.all([fetch(`${API}/elders`), fetch(`${API}/healthData`)]);
            allElders = (await er.json()).data || [];
            allHealth = (await hr.json()).data || [];
            const latest = new Map();
            allHealth.forEach(r => { const e = latest.get(r.elderId); if (!e || new Date(r.measureDate) > new Date(e.measureDate)) latest.set(r.elderId, r); });
            alerts = []; const highRisk = new Set();
            for (let [id, rec] of latest) {
                const elder = allElders.find(e => e.id === id);
                const items = checkAlert(rec);
                if (items.length > 0) {
                    const hasDanger = items.map(i => i.type).includes('danger');
                    alerts.push({ date: rec.measureDate, elderId: id, elderName: elder?.name || '未知', type: hasDanger ? 'danger' : 'warning', item: items.map(i => i.item).join('、'), value: items.map(i => i.value).join(' | '), suggest: items.map(i => i.suggest).join('；') });
                    if (hasDanger) highRisk.add(id);
        }
        }
            alerts.sort((a,b) => new Date(b.date) - new Date(a.date));

            // 家属默认不显示数据，需选择绑定老人后才有
            if (role === 'family') {
                renderTable([]);
                document.getElementById('totalAlerts').innerText = '0';
                document.getElementById('highRiskCount').innerText = '0';
                document.getElementById('todayNew').innerText = '0';
                    } else {
                renderTable(alerts);
                document.getElementById('totalAlerts').innerText = alerts.length;
                document.getElementById('highRiskCount').innerText = highRisk.size;
                document.getElementById('todayNew').innerText = alerts.filter(a => a.date === new Date().toISOString().slice(0,10)).length;
        }

                    // 下拉框
                if (role === 'family') {
                let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
                let boundElders = allElders.filter(e => bindings.some(b => b.elderId === e.id));
                document.getElementById('elderSelect').innerHTML = '<option value="">-- 请选择绑定老人 --</option>' + boundElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
                    } else {
                document.getElementById('elderSelect').innerHTML = '<option value="">🌐 全部老人</option>' + allElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
        }
           if (role === 'family') {
            let bindings = JSON.parse(localStorage.getItem(`bind_${user.username}`) || '[]');
            let boundElders = allElders.filter(e => bindings.some(b => b.elderId === e.id));
             document.getElementById('elderSelect').innerHTML = '<option value="">-- 请选择绑定老人 --</option>' + boundElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
           } else {
                document.getElementById('elderSelect').innerHTML = '<option value="">🌐 全部老人</option>' + allElders.map(e => `<option value="${e.id}">${e.name} (${e.id})</option>`).join('');
        }
        } catch(e) { showToast('加载失败，请检查网络'); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('alertBody');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">✅ 暂无预警记录</td></tr>'; return; }
        tbody.innerHTML = data.map(a => `<tr>
            <td style="text-align:center;">${a.date}</td>
            <td style="text-align:center;">${a.elderId}</td>
            <td style="text-align:center;">${a.elderName}</td>
            <td style="text-align:center;"><span class="${a.type}">${a.item}</span></td>
            <td style="text-align:center; font-weight:500;">${a.value}</td>
            <td style="text-align:left;">${a.suggest}</td>
        </tr>`).join('');
    }

    function filterAlerts() {
        let f = [...alerts];
        const e = document.getElementById('elderSelect').value;
        const s = document.getElementById('startDate').value;
        const ed = document.getElementById('endDate').value;
        if (e) f = f.filter(a => a.elderId === e);
        if (s) f = f.filter(a => a.date >= s);
        if (ed) f = f.filter(a => a.date <= ed);
        renderTable(f);
    }

    displayUserInfo();
    window.onload = () => { loadData(); const d = new Date(); d.setDate(d.getDate() - 30); document.getElementById('startDate').value = d.toISOString().slice(0,10); document.getElementById('endDate').value = new Date().toISOString().slice(0,10); };
</script>
</body>
</html>
